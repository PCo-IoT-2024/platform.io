; PlatformIO Project Configuration File for the configurable course/lego firmware
;
; This file is intentionally separate from the original platformio.ini.
; It keeps a modular structure and adds APP_HAS_* feature sets so students can
; build their own sensor combinations.
;
; IMPORTANT:
; The TTN credentials below are placeholders. Replace them with per-device
; credentials before uploading to real hardware.
;
; Examples:
;   pio run -c platformio.course-full.ini -e course_full_sx1262
;   pio run -c platformio.course-full.ini -e course_full_sx1276
;   pio run -c platformio.course-full.ini -e course_full_v101_sx1262
;   pio run -c platformio.course-full.ini -e course_temp_tds_sx1276 -t upload

[platformio]
default_envs =
    course_full_sx1262

; -----------------------------------------------------------------------------
; Libraries and sensor fragments
; -----------------------------------------------------------------------------

[radiolib]
lib_deps =
    https://github.com/jgromes/RadioLib.git

[gps]
build_flags =
    -D GPS_SERIAL_PORT=2
    -D GPS_SERIAL_BAUD_RATE=9600
    -D GPS_SERIAL_CONFIG=SERIAL_8N1
    -D GPS_SERIAL_RX_PIN=16
    -D GPS_SERIAL_TX_PIN=17
lib_deps =
    mikalhart/TinyGPSPlus

[temperature]
build_flags =
    -D DALLAS_TEMPERATURE_PIN=27
    -Wno-cpp
lib_deps =
    PaulStoffregen/OneWire
    milesburton/DallasTemperature

[ph]
build_flags =
    -D PH4502C_PH_PIN=34
    -D PH4502C_TEMPERATURE_PIN=35
    -D PH4_ADC_VALUE=2503
    -D PH7_ADC_VALUE=2080
    -D PH10_ADC_VALUE=1615
    -D APP_CALIBRATE_PH_PIN=0

[tds]
build_flags =
    -D TDS_SENSOR_PIN=32
    -D TDS_SENSOR_VCC=3.3
    -D TDS_SENSOR_ADC_RESOLUTION=4096
    -D TDS_DEFAULT_TEMPERATURE_C=22.0f
    ; GravityTDS internally refers to Arduino-style A1. ESP32 has no A1 symbol.
    ; Keep TDS_SENSOR_PIN as the single source of truth.
    -D A1=TDS_SENSOR_PIN
lib_deps =
    https://github.com/PCo-IoT-2024/GravityTDS.git
    eeprom

[turbidity]
build_flags =
    -D TURBIDITY_PIN=33
    -D TURBIDITY_VCC=3.3
    -D TURBIDITY_ADC_MAX=4096
    -D TURBIDITY_CLEAR_WATER_VOLTAGE=1.780
    -D TURBIDITY_CLEAR_WATER_NTU=0.0
    -D TURBIDITY_TURBID_WATER_VOLTAGE=0.840
    -D TURBIDITY_TURBID_WATER_NTU=600.0

[sensors_all]
lib_deps =
    ${gps.lib_deps}
    ${temperature.lib_deps}
    ${tds.lib_deps}
build_flags =
    ${gps.build_flags}
    ${temperature.build_flags}
    ${ph.build_flags}
    ${tds.build_flags}
    ${turbidity.build_flags}

; -----------------------------------------------------------------------------
; LoRaWAN region and TTN sandbox fragments
; -----------------------------------------------------------------------------

[eu868]
build_flags =
    -D RADIOLIB_LORA_REGION=EU868
    -D RADIOLIB_LORA_SUBBANDS=0
    ; safest for all EU868 DR0..DR2
    ;-D RADIOLIB_LORAWAN_PAYLOAD_SIZE=51
    ; safe only if DR3 or better
    -D RADIOLIB_LORAWAN_PAYLOAD_SIZE=115
    ; safe only if DR4/DR5 or better
    ;-D RADIOLIB_LORAWAN_PAYLOAD_SIZE=222

[ttn_sandbox]
build_flags =
    -std=gnu++17
    -D RADIOLIB_LORAWAN_JOIN_EUI="0x0000000000000000"
    -D RADIOLIB_DEBUG_LOG=1
    -D APP_DEBUG_SERIAL=1
    -D RADIOLIB_JOIN_RETRY_MIN_SECONDS="60UL"
    -D RADIOLIB_JOIN_RETRY_MAX_SECONDS="(60UL * 60UL)"
    -D APP_FACTORY_RESET_PIN=0
    -D APP_DANGEROUS_NONCE_RESET_PIN=15
    -D APP_LOW_BATTERY_SLEEP_SECONDS="(30UL * 60UL)"
    -D RADIOLIB_LORA_UPLINK_INTERVAL_SECONDS="(1UL * 60UL)"

[ttn_sandbox_lorawan]
build_flags =
    ${ttn_sandbox.build_flags}
    -D RADIOLIB_EXCLUDE_AFSK
    -D RADIOLIB_EXCLUDE_APRS
    -D RADIOLIB_EXCLUDE_AX25
    -D RADIOLIB_EXCLUDE_BELL
    -D RADIOLIB_EXCLUDE_FSK4
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER
;    -D RADIOLIB_EXCLUDE_LORAWAN
    -D RADIOLIB_EXCLUDE_MORSE
    -D RADIOLIB_EXCLUDE_PAGER
    -D RADIOLIB_EXCLUDE_RTTY
    -D RADIOLIB_EXCLUDE_SSTV

; -----------------------------------------------------------------------------
; LoRaWAN device identity fragments
; -----------------------------------------------------------------------------

; LoRaWAN 1.1.x identity: AppKey + NwkKey are present.
; Replace all placeholder bytes before real uploads.
[lorawan_v110_placeholder]
build_flags =
    -D RADIOLIB_LORAWAN_DEV_EUI="0x0000000000000000"
    -D RADIOLIB_LORAWAN_APP_KEY="0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00"
    -D RADIOLIB_LORAWAN_NWK_KEY="0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00"

; LoRaWAN 1.0.1 / 1.0.x style identity: only AppKey is present.
; No RADIOLIB_LORAWAN_NWK_KEY is defined. The firmware passes nullptr as NwkKey,
; which selects the RadioLib 1.0.x OTAA key model.
; Replace all placeholder bytes before real uploads.
[lorawan_v101_placeholder]
build_flags =
    -D RADIOLIB_LORAWAN_DEV_EUI="0x0000000000000000"
    -D RADIOLIB_LORAWAN_APP_KEY="0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00"

; -----------------------------------------------------------------------------
; Radio modules and board mappings
; -----------------------------------------------------------------------------

[sx1276]
build_flags =
    -D RADIOLIB_LORA_MODULE=SX1276
    -D RADIOLIB_EXCLUDE_CC1101
    -D RADIOLIB_EXCLUDE_SX126X
    -D RADIOLIB_EXCLUDE_LR11X0
    -D RADIOLIB_EXCLUDE_RF69
    -D RADIOLIB_EXCLUDE_RFM2X
    -D RADIOLIB_EXCLUDE_SX1231
;    -D RADIOLIB_EXCLUDE_SX127X
    -D RADIOLIB_EXCLUDE_SX128X
    -D RADIOLIB_EXCLUDE_SI443X
    -D RADIOLIB_EXCLUDE_NRF24

[sx1262]
build_flags =
    -D RADIOLIB_LORA_MODULE=SX1262
    -D RADIOLIB_EXCLUDE_CC1101
;    -D RADIOLIB_EXCLUDE_SX126X
    -D RADIOLIB_EXCLUDE_LR11X0
    -D RADIOLIB_EXCLUDE_RF69
    -D RADIOLIB_EXCLUDE_RFM2X
    -D RADIOLIB_EXCLUDE_SX1231
    -D RADIOLIB_EXCLUDE_SX127X
    -D RADIOLIB_EXCLUDE_SX128X
    -D RADIOLIB_EXCLUDE_SI443X
    -D RADIOLIB_EXCLUDE_NRF24

[sx1276_radiolib_esp32dev]
lib_deps =
    ${radiolib.lib_deps}
build_flags =
    ${sx1276.build_flags}
    -D RADIOLIB_LORA_MODULE_BITMAP="5, 2, 14, 4"
; SX1276 bitmap: NSS/CS, DIO0, RESET, DIO1

[sx1262_radiolib_esp32dev]
lib_deps =
    ${radiolib.lib_deps}
build_flags =
    ${sx1262.build_flags}
    -D RADIOLIB_LORA_MODULE_BITMAP="5, 2, 14, 4"
; SX1262 bitmap: NSS/CS, DIO1, RESET, BUSY

[ttn_sandbox_lorawan_sx1276_radiolib_esp32]
lib_deps =
    ${sx1276_radiolib_esp32dev.lib_deps}
build_flags =
    ${ttn_sandbox_lorawan.build_flags}
    ${sx1276_radiolib_esp32dev.build_flags}

[ttn_sandbox_lorawan_sx1262_radiolib_esp32]
lib_deps =
    ${sx1262_radiolib_esp32dev.lib_deps}
build_flags =
    ${ttn_sandbox_lorawan.build_flags}
    ${sx1262_radiolib_esp32dev.build_flags}

; -----------------------------------------------------------------------------
; Lego feature sets
; -----------------------------------------------------------------------------

[features_none]
build_flags =
    -D APP_HAS_GPS=0
    -D APP_HAS_TEMPERATURE=0
    -D APP_HAS_PH=0
    -D APP_HAS_TDS=0
    -D APP_HAS_TURBIDITY=0

[features_full]
build_flags =
    -D APP_HAS_GPS=1
    -D APP_HAS_TEMPERATURE=1
    -D APP_HAS_PH=1
    -D APP_HAS_TDS=1
    -D APP_HAS_TURBIDITY=1

[features_gps_temperature]
build_flags =
    -D APP_HAS_GPS=1
    -D APP_HAS_TEMPERATURE=1
    -D APP_HAS_PH=0
    -D APP_HAS_TDS=0
    -D APP_HAS_TURBIDITY=0

[features_temperature_tds]
build_flags =
    -D APP_HAS_GPS=0
    -D APP_HAS_TEMPERATURE=1
    -D APP_HAS_PH=0
    -D APP_HAS_TDS=1
    -D APP_HAS_TURBIDITY=0

[features_gps_temperature_tds]
build_flags =
    -D APP_HAS_GPS=1
    -D APP_HAS_TEMPERATURE=1
    -D APP_HAS_PH=0
    -D APP_HAS_TDS=1
    -D APP_HAS_TURBIDITY=0

[features_ph_turbidity]
build_flags =
    -D APP_HAS_GPS=0
    -D APP_HAS_TEMPERATURE=0
    -D APP_HAS_PH=1
    -D APP_HAS_TDS=0
    -D APP_HAS_TURBIDITY=1

[features_water_basic]
build_flags =
    -D APP_HAS_GPS=1
    -D APP_HAS_TEMPERATURE=1
    -D APP_HAS_PH=1
    -D APP_HAS_TDS=1
    -D APP_HAS_TURBIDITY=0

; -----------------------------------------------------------------------------
; Main local environment defaults
; -----------------------------------------------------------------------------

[env]
build_unflags =
    -std=gnu++11
    -std=c++11
    -std=gnu++14
    -std=c++14

[env_common]
platform = espressif32
board = esp32dev
framework = arduino

