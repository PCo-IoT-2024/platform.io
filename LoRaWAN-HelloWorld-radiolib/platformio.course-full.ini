; PlatformIO Project Configuration File for the configurable course/lego firmware
;
; This file is intentionally only a thin overlay over the existing platformio.ini.
; The existing platformio.ini is included unchanged, so all original fragments,
; environments and device credentials/keys remain available and are reused here.
;
; Build examples:
;   pio run -c platformio.course-full.ini -e lego_full_sx1262_v11_v104
;   pio run -c platformio.course-full.ini -e lego_temp_tds_sx1262_v11_v104
;   pio run -c platformio.course-full.ini -e lego_full_sx1276_v110_experiment
;   pio run -c platformio.course-full.ini -e lego_full_sx1276_v101
;
; Upload example:
;   pio run -c platformio.course-full.ini -e lego_full_sx1262_v11_v104 -t upload

[platformio]
extra_configs = platformio.ini
default_envs =
    lego_full_sx1262_v11_v104

; -----------------------------------------------------------------------------
; Lego feature sets
; -----------------------------------------------------------------------------

[features_none]
build_flags =
    -D APP_HAS_GPS=0
    -D APP_HAS_TEMPERATURE=0
    -D APP_HAS_PH=0
    -D APP_HAS_TDS=0
    -D APP_HAS_TURBIDITY=0

[features_full]
build_flags =
    -D APP_HAS_GPS=1
    -D APP_HAS_TEMPERATURE=1
    -D APP_HAS_PH=1
    -D APP_HAS_TDS=1
    -D APP_HAS_TURBIDITY=1

[features_gps_temperature]
build_flags =
    -D APP_HAS_GPS=1
    -D APP_HAS_TEMPERATURE=1
    -D APP_HAS_PH=0
    -D APP_HAS_TDS=0
    -D APP_HAS_TURBIDITY=0

[features_temperature_tds]
build_flags =
    -D APP_HAS_GPS=0
    -D APP_HAS_TEMPERATURE=1
    -D APP_HAS_PH=0
    -D APP_HAS_TDS=1
    -D APP_HAS_TURBIDITY=0

[features_gps_temperature_tds]
build_flags =
    -D APP_HAS_GPS=1
    -D APP_HAS_TEMPERATURE=1
    -D APP_HAS_PH=0
    -D APP_HAS_TDS=1
    -D APP_HAS_TURBIDITY=0

[features_ph_turbidity]
build_flags =
    -D APP_HAS_GPS=0
    -D APP_HAS_TEMPERATURE=0
    -D APP_HAS_PH=1
    -D APP_HAS_TDS=0
    -D APP_HAS_TURBIDITY=1

[features_water_basic]
build_flags =
    -D APP_HAS_GPS=1
    -D APP_HAS_TEMPERATURE=1
    -D APP_HAS_PH=1
    -D APP_HAS_TDS=1
    -D APP_HAS_TURBIDITY=0

; -----------------------------------------------------------------------------
; SX1262 lego environments
; These reuse the original sx1262-v11-v104-01 keys from platformio.ini.
; -----------------------------------------------------------------------------

[env:lego_full_sx1262_v11_v104]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    ${ttn_sandbox_lorawan_sx1262_radiolib_esp32.lib_deps}
    ${gps.lib_deps}
    ${temperature.lib_deps}
    ${tds.lib_deps}
build_flags =
    ${eu868.build_flags}
    ${ttn_sandbox_lorawan_sx1262_radiolib_esp32.build_flags}
    ${sx1262-v11-v104-01.build_flags}
    ${message_experiment_110.build_flags}
    ${gps.build_flags}
    ${temperature.build_flags}
    ${ph.build_flags}
    ${tds.build_flags}
    ${turbidity.build_flags}
    ${features_full.build_flags}
    -D RADIOLIB_LORA_UPLINK_INTERVAL_SECONDS="(1UL * 60UL)"

