; SX1262 LoRaWAN 1.0.1-style build using the same existing SX1262 AppKey/DevEUI
; but undefining the NwkKey macro after the original key fragment.
[env:lego_full_sx1262_v101]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    ${ttn_sandbox_lorawan_sx1262_radiolib_esp32.lib_deps}
    ${gps.lib_deps}
    ${temperature.lib_deps}
    ${tds.lib_deps}
build_flags =
    ${eu868.build_flags}
    ${ttn_sandbox_lorawan_sx1262_radiolib_esp32.build_flags}
    ${sx1262-v11-v104-01.build_flags}
    -U RADIOLIB_LORAWAN_NWK_KEY
    ${message_104.build_flags}
    ${gps.build_flags}
    ${temperature.build_flags}
    ${ph.build_flags}
    ${tds.build_flags}
    ${turbidity.build_flags}
    ${features_full.build_flags}
    -D RADIOLIB_LORA_UPLINK_INTERVAL_SECONDS="(1UL * 60UL)"

[env:lego_temp_tds_sx1262_v101]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    ${ttn_sandbox_lorawan_sx1262_radiolib_esp32.lib_deps}
    ${gps.lib_deps}
    ${temperature.lib_deps}
    ${tds.lib_deps}
build_flags =
