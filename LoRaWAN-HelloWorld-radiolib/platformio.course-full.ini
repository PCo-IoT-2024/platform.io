; PlatformIO Project Configuration File for the configurable course/lego firmware
;
; This file is intentionally separate from the original platformio.ini.
; It keeps the same modular structure as the working course template, but adds
; APP_HAS_* feature sets so students can build their own sensor combinations.
;
; Examples:
;   pio run -c platformio.course-full.ini -e course_full_sx1262
;   pio run -c platformio.course-full.ini -e course_full_sx1276
;   pio run -c platformio.course-full.ini -e course_temp_tds_sx1262
;   pio run -c platformio.course-full.ini -e course_ph_turbidity_sx1276 -t upload

[platformio]
default_envs =
    course_full_sx1262

; -----------------------------------------------------------------------------
; Libraries and sensor fragments
; -----------------------------------------------------------------------------

; Use RadioLib from GitHub.
[radiolib]
lib_deps =
    https://github.com/jgromes/RadioLib.git

; GPS module.
[gps]
build_flags =
    -D GPS_SERIAL_PORT=2
    -D GPS_SERIAL_BAUD_RATE=9600
    -D GPS_SERIAL_CONFIG=SERIAL_8N1
    -D GPS_SERIAL_RX_PIN=16
    -D GPS_SERIAL_TX_PIN=17
lib_deps =
    mikalhart/TinyGPSPlus

; DS18B20 temperature sensor.
[temperature]
build_flags =
    -D DALLAS_TEMPERATURE_PIN=27
    -Wno-cpp
lib_deps =
    PaulStoffregen/OneWire
    milesburton/DallasTemperature

; PH4502C pH sensor.
[ph]
build_flags =
    -D PH4502C_PH_PIN=34
    -D PH4502C_TEMPERATURE_PIN=35
    -D PH4_ADC_VALUE=2503
    -D PH7_ADC_VALUE=2080
    -D PH10_ADC_VALUE=1615
    -D APP_CALIBRATE_PH_PIN=0

; Gravity TDS sensor.
[tds]
build_flags =
    -D TDS_SENSOR_PIN=32
    -D TDS_SENSOR_VCC=3.3
    -D TDS_SENSOR_ADC_RESOLUTION=4096
    -D TDS_DEFAULT_TEMPERATURE_C=22.0f
    ; GravityTDS internally refers to Arduino-style A1. ESP32 has no A1 symbol.
    ; Keep TDS_SENSOR_PIN as the single source of truth.
    -D A1=TDS_SENSOR_PIN
lib_deps =
    https://github.com/PCo-IoT-2024/GravityTDS.git
    eeprom

; Analog turbidity sensor.
[turbidity]
build_flags =
    -D TURBIDITY_PIN=33
    -D TURBIDITY_VCC=3.3
    -D TURBIDITY_ADC_MAX=4096
    -D TURBIDITY_CLEAR_WATER_VOLTAGE=1.780
    -D TURBIDITY_CLEAR_WATER_NTU=0.0
    -D TURBIDITY_TURBID_WATER_VOLTAGE=0.840
    -D TURBIDITY_TURBID_WATER_NTU=600.0

; -----------------------------------------------------------------------------
; LoRaWAN region and device identities
; -----------------------------------------------------------------------------

; EU868 region settings.
[eu868]
build_flags =
    -D RADIOLIB_LORA_REGION=EU868
    -D RADIOLIB_LORA_SUBBANDS=0
    ; safest for all EU868 DR0..DR2
    ;-D RADIOLIB_LORAWAN_PAYLOAD_SIZE=51
    ; safe only if DR3 or better
    -D RADIOLIB_LORAWAN_PAYLOAD_SIZE=115
    ; safe only if DR4/DR5 or better
    ;-D RADIOLIB_LORAWAN_PAYLOAD_SIZE=222

; This is for SX1262 - LoRaWAN 1.1.0 device, Reg params 1.1.0.
; TTN: sx1262-v11-a-01
[sx1262-v11-a-01]
build_flags =
    -D RADIOLIB_LORAWAN_DEV_EUI="0x70B3D57ED0070597"
    -D RADIOLIB_LORAWAN_APP_KEY="0x1B, 0xBF, 0xF6, 0x36, 0xC7, 0x28, 0xAA, 0xFB, 0x37, 0x91, 0xCF, 0xA8, 0x3E, 0x2D, 0x00, 0x26"
    -D RADIOLIB_LORAWAN_NWK_KEY="0x13, 0xFF, 0x72, 0xEC, 0xFC, 0xEC, 0xF7, 0x99, 0x3D, 0xC1, 0x64, 0x1B, 0x2D, 0x9B, 0x0E, 0x2A"

; This is for SX1262 - LoRaWAN 1.1.0 device, Reg params 1.0.4.
; TTN: sx1262-v11-v104-01
[sx1262-v11-v104-01]
build_flags =
    -D RADIOLIB_LORAWAN_DEV_EUI="0x70B3D57ED007733D"
    -D RADIOLIB_LORAWAN_APP_KEY="0x0E, 0x5F, 0x84, 0x24, 0x0B, 0x14, 0x97, 0xA5, 0xB1, 0x19, 0x08, 0xF0, 0x83, 0xED, 0xD9, 0xDB"
    -D RADIOLIB_LORAWAN_NWK_KEY="0x8C, 0x08, 0x0F, 0xC7, 0x75, 0xAA, 0x5B, 0x90, 0x70, 0xBF, 0x56, 0xBB, 0x2B, 0x0F, 0x5A, 0xA8"

; This is for SX1276 - LoRaWAN 1.1.0 experiment device.
; TTN: voc-experiment-1-110
[voc-experiment-1-110]
build_flags =
    -D RADIOLIB_LORAWAN_DEV_EUI="0x70B3D57ED006B069"
    -D RADIOLIB_LORAWAN_APP_KEY="0x50, 0x94, 0x11, 0xA7, 0x1E, 0x13, 0x16, 0xE3, 0x4F, 0xDD, 0xFF, 0x0E, 0xA6, 0x06, 0x29, 0x85"
    -D RADIOLIB_LORAWAN_NWK_KEY="0x0C, 0xA5, 0x90, 0x8F, 0x18, 0x89, 0xA4, 0xE3, 0x99, 0xA3, 0xC2, 0x0A, 0xFF, 0x9F, 0x77, 0x45"

; This is for SX1276 - LoRaWAN 1.1.0 test device.
[voc_radiolib_tmp_v110_1_1]
build_flags =
    -D RADIOLIB_LORAWAN_DEV_EUI="0x70B3D57ED006AF2B"
    -D RADIOLIB_LORAWAN_APP_KEY="0x26, 0xFD, 0x49, 0x41, 0x8E, 0xC9, 0xAC, 0xE9, 0x7A, 0xD8, 0xCE, 0x14, 0x83, 0xED, 0xD4, 0x00"
    -D RADIOLIB_LORAWAN_NWK_KEY="0x65, 0xB5, 0x3D, 0xCD, 0xEC, 0xE6, 0xAC, 0x36, 0x73, 0xE8, 0x2B, 0x6A, 0xD6, 0xDA, 0x7D, 0x93"

; This is for SX1276 - LoRaWAN 1.0.4 test device.
[voc_radiolib_tmp_1]
build_flags =
    -D RADIOLIB_LORAWAN_DEV_EUI="0x70B3D57ED006AF06"
    -D RADIOLIB_LORAWAN_APP_KEY="0x9D, 0xAB, 0xD0, 0xC7, 0xE0, 0x82, 0xF2, 0x9A, 0xCD, 0xC7, 0x13, 0x8F, 0x17, 0xF8, 0x47, 0x64"

; -----------------------------------------------------------------------------
; Radio modules and board mappings
; -----------------------------------------------------------------------------

; SX1276: exclude irrelevant modules.
[sx1276]
build_flags =
    -D RADIOLIB_LORA_MODULE=SX1276
    -D RADIOLIB_EXCLUDE_CC1101
    -D RADIOLIB_EXCLUDE_SX126X
    -D RADIOLIB_EXCLUDE_LR11X0
    -D RADIOLIB_EXCLUDE_RF69
    -D RADIOLIB_EXCLUDE_RFM2X
    -D RADIOLIB_EXCLUDE_SX1231
;    -D RADIOLIB_EXCLUDE_SX127X
    -D RADIOLIB_EXCLUDE_SX128X
    -D RADIOLIB_EXCLUDE_SI443X
    -D RADIOLIB_EXCLUDE_NRF24

; SX1262: exclude irrelevant modules.
[sx1262]
build_flags =
    -D RADIOLIB_LORA_MODULE=SX1262
    -D RADIOLIB_EXCLUDE_CC1101
;    -D RADIOLIB_EXCLUDE_SX126X
    -D RADIOLIB_EXCLUDE_LR11X0
    -D RADIOLIB_EXCLUDE_RF69
    -D RADIOLIB_EXCLUDE_RFM2X
    -D RADIOLIB_EXCLUDE_SX1231
    -D RADIOLIB_EXCLUDE_SX127X
    -D RADIOLIB_EXCLUDE_SX128X
    -D RADIOLIB_EXCLUDE_SI443X
    -D RADIOLIB_EXCLUDE_NRF24

; ESP32 DevKit with SX1276.
[sx1276_radiolib_esp32dev]
lib_deps =
    ${radiolib.lib_deps}
build_flags =
    ${sx1276.build_flags}
    -D RADIOLIB_LORA_MODULE_BITMAP="5, 2, 14, 4"
; SX1276 bitmap: NSS/CS, DIO0, RESET, DIO1

; ESP32 DevKit with SX1262.
[sx1262_radiolib_esp32dev]
lib_deps =
    ${radiolib.lib_deps}
build_flags =
    ${sx1262.build_flags}
    -D RADIOLIB_LORA_MODULE_BITMAP="5, 2, 14, 4"
; SX1262 bitmap: NSS/CS, DIO1, RESET, BUSY

; -----------------------------------------------------------------------------
; TTN sandbox and LoRaWAN protocol configuration
; -----------------------------------------------------------------------------

[ttn_sandbox]
build_flags =
    -std=gnu++17
    -D RADIOLIB_LORAWAN_JOIN_EUI="0x0000000000000000"
    -D RADIOLIB_DEBUG_LOG=1
    -D APP_DEBUG_SERIAL=1
    -D RADIOLIB_JOIN_RETRY_MIN_SECONDS="60UL"
    -D RADIOLIB_JOIN_RETRY_MAX_SECONDS="(60UL * 60UL)"
    -D APP_FACTORY_RESET_PIN=0
    -D APP_DANGEROUS_NONCE_RESET_PIN=15
    -D APP_LOW_BATTERY_SLEEP_SECONDS="(30UL * 60UL)"
    -D RADIOLIB_LORA_UPLINK_INTERVAL_SECONDS="(1UL * 60UL)"

; LoRaWAN: exclude irrelevant protocols.
[ttn_sandbox_lorawan]
build_flags =
    ${ttn_sandbox.build_flags}
    -D RADIOLIB_EXCLUDE_AFSK
    -D RADIOLIB_EXCLUDE_APRS
    -D RADIOLIB_EXCLUDE_AX25
    -D RADIOLIB_EXCLUDE_BELL
    -D RADIOLIB_EXCLUDE_FSK4
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER
;    -D RADIOLIB_EXCLUDE_LORAWAN
    -D RADIOLIB_EXCLUDE_MORSE
    -D RADIOLIB_EXCLUDE_PAGER
    -D RADIOLIB_EXCLUDE_RTTY
    -D RADIOLIB_EXCLUDE_SSTV

; Add LoRaWAN protocol for SX1276 ESP32.
[ttn_sandbox_lorawan_sx1276_radiolib_esp32]
lib_deps =
    ${sx1276_radiolib_esp32dev.lib_deps}
build_flags =
    ${ttn_sandbox_lorawan.build_flags}
    ${sx1276_radiolib_esp32dev.build_flags}

; Add LoRaWAN protocol for SX1262 ESP32.
[ttn_sandbox_lorawan_sx1262_radiolib_esp32]
lib_deps =
    ${sx1262_radiolib_esp32dev.lib_deps}
build_flags =
    ${ttn_sandbox_lorawan.build_flags}
    ${sx1262_radiolib_esp32dev.build_flags}

; -----------------------------------------------------------------------------
; Lego feature sets
; -----------------------------------------------------------------------------

[features_none]
build_flags =
    -D APP_HAS_GPS=0
    -D APP_HAS_TEMPERATURE=0
    -D APP_HAS_PH=0
    -D APP_HAS_TDS=0
    -D APP_HAS_TURBIDITY=0

[features_full]
build_flags =
    -D APP_HAS_GPS=1
    -D APP_HAS_TEMPERATURE=1
    -D APP_HAS_PH=1
    -D APP_HAS_TDS=1
    -D APP_HAS_TURBIDITY=1

[features_gps_temperature]
build_flags =
    -D APP_HAS_GPS=1
    -D APP_HAS_TEMPERATURE=1
    -D APP_HAS_PH=0
    -D APP_HAS_TDS=0
    -D APP_HAS_TURBIDITY=0

[features_temperature_tds]
build_flags =
    -D APP_HAS_GPS=0
    -D APP_HAS_TEMPERATURE=1
    -D APP_HAS_PH=0
    -D APP_HAS_TDS=1
    -D APP_HAS_TURBIDITY=0

[features_gps_temperature_tds]
build_flags =
    -D APP_HAS_GPS=1
    -D APP_HAS_TEMPERATURE=1
    -D APP_HAS_PH=0
    -D APP_HAS_TDS=1
    -D APP_HAS_TURBIDITY=0

[features_ph_turbidity]
build_flags =
    -D APP_HAS_GPS=0
    -D APP_HAS_TEMPERATURE=0
    -D APP_HAS_PH=1
    -D APP_HAS_TDS=0
    -D APP_HAS_TURBIDITY=1

[features_water_basic]
build_flags =
    -D APP_HAS_GPS=1
    -D APP_HAS_TEMPERATURE=1
    -D APP_HAS_PH=1
    -D APP_HAS_TDS=1
    -D APP_HAS_TURBIDITY=0

; -----------------------------------------------------------------------------
; Main local environment defaults
; -----------------------------------------------------------------------------

[env]
build_unflags =
    -std=gnu++11
    -std=c++11
    -std=gnu++14
    -std=c++14

; -----------------------------------------------------------------------------
; Prepared SX1262 student build environments
; -----------------------------------------------------------------------------

; Validated complete reference firmware.
[env:course_full_sx1262]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    ${ttn_sandbox_lorawan_sx1262_radiolib_esp32.lib_deps}
    ${gps.lib_deps}
    ${temperature.lib_deps}
    ${tds.lib_deps}
build_flags =
    ${eu868.build_flags}
    ${ttn_sandbox_lorawan_sx1262_radiolib_esp32.build_flags}
    ${sx1262-v11-v104-01.build_flags}
    ${gps.build_flags}
    ${temperature.build_flags}
    ${ph.build_flags}
    ${tds.build_flags}
    ${turbidity.build_flags}
    ${features_full.build_flags}

; Minimal LoRaWAN test without sensor acquisition. Sends fPort 221 diagnostics.
[env:course_base_sx1262]
