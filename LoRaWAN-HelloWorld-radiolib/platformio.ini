; Generated PlatformIO configuration for the LoRaWAN water buoy lego firmware
; Generated by tools/platformio-ini-generator
;
; Radio module: SX1262
; LoRaWAN key model: 1.1.0
;
; The environment below is listed in [platformio] default_envs.
; Therefore -e is not needed for the usual commands.
;
; Build:
;   pio run
; Upload:
;   pio run -t upload
; Monitor:
;   pio device monitor

[platformio]
default_envs = water_buoy_sx1262

[env:water_buoy_sx1262]
platform = espressif32
board = esp32dev
framework = arduino
build_unflags =
    -std=gnu++11
    -std=c++11
    -std=gnu++14
    -std=c++14
lib_deps =
    https://github.com/jgromes/RadioLib.git
    mikalhart/TinyGPSPlus
    PaulStoffregen/OneWire
    milesburton/DallasTemperature
    eeprom
build_flags =
    -std=gnu++17
    -D RADIOLIB_LORAWAN_JOIN_EUI="0x0000000000000000"
    -D RADIOLIB_LORAWAN_DEV_EUI="0x70B3D57ED0077603"
    -D RADIOLIB_LORAWAN_APP_KEY="0xB9, 0xF7, 0x3D, 0xC8, 0x49, 0xAC, 0xFC, 0x4D, 0xAB, 0xBF, 0x10, 0xDD, 0xD1, 0xC7, 0x88, 0xF1"
    -D RADIOLIB_LORAWAN_NWK_KEY="0x59, 0x97, 0xF4, 0xED, 0x2A, 0xDF, 0x34, 0x65, 0x1A, 0x7C, 0x61, 0x5A, 0x3D, 0x6B, 0xFF, 0x7C"
    -D RADIOLIB_DEBUG_LOG=1
    -D APP_DEBUG_SERIAL=1
    -D APP_FACTORY_RESET_PIN=0
    -D APP_DANGEROUS_NONCE_RESET_PIN=15
    -D APP_PH_CALIBRATION_PIN=25
